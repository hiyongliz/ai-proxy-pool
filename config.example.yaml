server:
  listen_addr: ":8080"
  read_timeout: 30s
  write_timeout: 300s
  idle_timeout: 60s
  upstream_timeout: 300s
  max_request_body_bytes: 8388608 # 8 MiB
  retry:
    max_attempts: 3        # 最大尝试次数（含首次），默认 3
    retry_on_5xx: true     # 5xx 响应时重试，默认 true
    retry_on_network: true # 网络错误时重试，默认 true
  auth:
    enabled: true
    header: "Authorization"
    scheme: "Bearer"
    token: "${PROXY_AUTH_TOKEN}"

router:
  strategy: "round_robin" # round_robin | weighted_random
  default_provider: "claude-backup"
  header_provider_key: "X-AI-Provider"
  route_rules:
    - path_prefix: "/v1/messages"
      model_prefix: "claude-opus"
      providers: ["claude-primary"]
    - path_prefix: "/v1/messages"
      providers: ["claude-backup"]

providers:
  - name: "claude-primary"
    base_url: "https://api.anthropic.com"
    path_prefix: "" # 如果你的上游网关是 /anthropic/v1，可配置为该前缀
    upstream_path: "" # 可选：强制把请求转发到固定路径（如 /v1/responses）
    enabled: true
    weight: 5
    timeout: 300s
    api_key: "${ANTHROPIC_API_KEY_PRIMARY}"
    auth_type: "auth_token" # auth_token | bearer | x-api-key | none
    auth_header: "Authorization"
    target_api: "claude" # claude | codex
    request_translate: "none" # none | claude_to_codex (请求+响应双向转换)
    static_headers:
      anthropic-version: "2023-06-01"
    model_prefixes: ["claude-4", "claude-3"]

  - name: "claude-backup"
    base_url: "https://your-claude-compatible-provider.example.com"
    upstream_path: ""
    enabled: true
    weight: 2
    timeout: 300s
    api_key: "${ANTHROPIC_API_KEY_BACKUP}"
    auth_type: "auth_token"
    auth_header: "Authorization"
    target_api: "claude"
    request_translate: "none"
    static_headers:
      anthropic-version: "2023-06-01"
    model_mapping:
      claude-opus-4-6: "claude-opus-4-5"   # 请求 claude-opus-4-6 时，上游实际使用 claude-opus-4-5
      claude-sonnet-4-6: "claude-sonnet-4-5"

  # 示例：将 Claude 请求体转换为 Codex /v1/responses 请求体
  - name: "codex-gateway"
    base_url: "https://your-codex-gateway.example.com"
    upstream_path: "/v1/responses"
    enabled: false
    weight: 1
    timeout: 300s
    api_key: "${CODEX_API_KEY}"
    auth_type: "bearer"
    target_api: "codex"
    request_translate: "claude_to_codex"
